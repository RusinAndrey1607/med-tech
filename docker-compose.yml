services:
  postgres:
    image: postgres:17
    container_name: med-tech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: med_tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
